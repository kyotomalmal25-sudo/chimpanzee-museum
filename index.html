<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CHIMPANZEE MUSEUM public image archive.">
  <title>CHIMPANZEE MUSEUM</title>
  <style>
    :root {
      --black: #0a0a0a;
      --black-soft: #101010;
      --yellow: #ccff00;
      --green: #39ff14;
      --ink: #f2f2ec;
      --muted: #8f9289;
      --line: rgba(204, 255, 0, 0.22);
    }
    * { box-sizing: border-box; }
    html { background: var(--black); color-scheme: dark; }
    body {
      min-width: 320px;
      margin: 0;
      background: radial-gradient(circle at 50% -10%, rgba(204, 255, 0, .055), transparent 34rem), var(--black);
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.5;
    }
    button { font: inherit; cursor: pointer; }
    .museum { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 62px 0 84px; }
    .museum-header { display: flex; align-items: end; justify-content: space-between; gap: 32px; padding-bottom: 36px; border-bottom: 1px solid var(--line); }
    .museum-kicker { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; color: var(--muted); font-size: .7rem; font-weight: 700; letter-spacing: .22em; }
    .status-dot, .mark { color: var(--green); text-shadow: 0 0 10px rgba(57,255,20,.35); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 9px rgba(57,255,20,.55); }
    h1 { max-width: 700px; margin: 0; color: var(--yellow); font-size: clamp(2.6rem, 8vw, 6.9rem); font-weight: 900; letter-spacing: -.075em; line-height: .82; }
    h1 span { display: block; color: var(--ink); font-size: .46em; letter-spacing: .16em; line-height: 1.4; text-indent: .12em; }
    .philosophy { margin: 0 0 4px; color: var(--muted); font-size: .7rem; letter-spacing: .14em; line-height: 1.7; text-align: right; white-space: nowrap; }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 42px 24px; padding-top: 42px; }
    .card { min-width: 0; }
    .image-button { display: block; width: 100%; aspect-ratio: 1; padding: 0; overflow: hidden; border: 1px solid rgba(242,242,236,.16); background: var(--black-soft); transition: border-color 280ms ease, box-shadow 280ms ease; }
    .image-button::after { position: absolute; inset: 10px; border: 1px solid rgba(204,255,0,.12); content: ""; pointer-events: none; }
    .image-button { position: relative; }
    .image-button img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform 500ms cubic-bezier(.2,.75,.25,1), filter 500ms ease; }
    .card:hover .image-button, .card:focus-within .image-button { border-color: var(--yellow); box-shadow: 0 8px 24px rgba(204,255,0,.32), 0 0 10px rgba(57,255,20,.12); }
    .card:hover .image-button img, .card:focus-within .image-button img { transform: scale(1.045); filter: saturate(1.1) contrast(1.04); }
    .image-button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; }
    .card-meta { display: flex; justify-content: space-between; gap: 16px; padding: 13px 2px 0; color: var(--muted); font-size: .68rem; font-weight: 700; letter-spacing: .16em; }
    .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .empty { grid-column: 1 / -1; min-height: 420px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; text-align: center; color: var(--muted); }
    .empty p { margin: 0; font-size: .77rem; letter-spacing: .08em; }
    .empty strong { display: block; margin-bottom: 9px; color: var(--yellow); font-size: .8rem; letter-spacing: .12em; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 42px; color: var(--muted); font-size: .68rem; letter-spacing: .09em; }
    .pagination { display: flex; align-items: center; gap: 18px; }
    .page-button { border: 0; background: transparent; color: var(--yellow); padding: 0; font-size: .72rem; font-weight: 700; letter-spacing: .1em; }
    .page-button:disabled { color: #3c3c36; cursor: default; }
    .page-number { min-width: 42px; color: #e9e9e2; text-align: center; }
    .lightbox[hidden] { display: none; }
    .lightbox { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 32px; background: rgba(0,0,0,.95); }
    .lightbox-inner { position: relative; max-width: min(1100px, 100%); max-height: 100%; }
    .lightbox img { display: block; max-width: 100%; max-height: calc(100vh - 64px); object-fit: contain; }
    .close-button { position: absolute; top: -30px; right: 0; border: 0; background: transparent; color: var(--yellow); padding: 0; font-size: .72rem; font-weight: 700; letter-spacing: .1em; }
    @media (max-width: 760px) { .museum { width: min(100% - 32px, 560px); padding-top: 38px; } .museum-header { align-items: start; flex-direction: column; gap: 24px; } .philosophy { margin: 0; text-align: left; } .gallery { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 30px 16px; padding-top: 30px; } }
    @media (max-width: 470px) { .gallery { grid-template-columns: 1fr; gap: 34px; } }
    @media (prefers-reduced-motion: reduce) { .image-button, .image-button img { transition-duration: 1ms; } }
  </style>
</head>
<body>
  <main class="museum">
    <header class="museum-header">
      <div><p class="museum-kicker"><span class="status-dot" aria-hidden="true"></span>PUBLIC ARCHIVE</p><h1>CHIMPANZEE<span>MUSEUM</span></h1></div>
      <p class="philosophy">BANANAS NEED NO REASON.</p>
    </header>
    <section class="gallery" id="gallery" aria-label="Chimpanzee Museum Gallery" aria-live="polite"></section>
    <footer class="footer"><div id="countLabel">0 IMAGES / PUBLIC ARCHIVE</div><nav class="pagination" aria-label="Gallery pages"><button class="page-button" id="prevButton" type="button">← PREV</button><span class="page-number" id="pageLabel">1 / 1</span><button class="page-button" id="nextButton" type="button">NEXT →</button></nav></footer>
  </main>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Original image viewer"><div class="lightbox-inner"><button class="close-button" id="closeButton" type="button">CLOSE</button><img id="lightboxImage" alt=""></div></div>
  <script>
    (() => {
      'use strict';
      const PAGE_SIZE = 9;
      let images = [], currentPage = 0;
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
      function render() {
        const pageCount = Math.max(1, Math.ceil(images.length / PAGE_SIZE));
        currentPage = Math.min(currentPage, pageCount - 1);
        const pageImages = images.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
        $('gallery').innerHTML = pageImages.length ? pageImages.map((image) => `<article class="card" data-file="${escapeHtml(image.file)}"><button class="image-button" type="button" data-action="view" aria-label="View ${escapeHtml(image.alt || image.name || image.file)}"><img src="${escapeHtml(image.file)}" alt="${escapeHtml(image.alt || image.name || image.file)}" loading="lazy"></button><div class="card-meta"><div class="filename" title="${escapeHtml(image.name || image.file)}">${escapeHtml(image.name || image.file)}</div><span class="mark" aria-hidden="true">●</span></div></article>`).join('') : '<div class="empty"><p><strong>NO EXHIBITS YET</strong>THE PUBLIC ARCHIVE IS BEING PREPARED</p></div>';
        $('countLabel').textContent = `${images.length} ${images.length === 1 ? 'IMAGE' : 'IMAGES'} / PUBLIC ARCHIVE`;
        $('pageLabel').textContent = `${currentPage + 1} / ${pageCount}`;
        $('prevButton').disabled = currentPage === 0; $('nextButton').disabled = currentPage >= pageCount - 1;
      }
      function closeLightbox() { $('lightbox').hidden = true; $('lightboxImage').removeAttribute('src'); }
      $('prevButton').addEventListener('click', () => { currentPage--; render(); });
      $('nextButton').addEventListener('click', () => { currentPage++; render(); });
      $('closeButton').addEventListener('click', closeLightbox);
      $('lightbox').addEventListener('click', (event) => { if (event.target === $('lightbox')) closeLightbox(); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !$('lightbox').hidden) closeLightbox(); });
      $('gallery').addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]')?.dataset.action, card = event.target.closest('.card');
        if (action !== 'view' || !card) return;
        const image = images.find((item) => item.file === card.dataset.file); if (!image) return;
        $('lightboxImage').src = image.file; $('lightboxImage').alt = image.alt || image.name || image.file; $('lightbox').hidden = false; $('closeButton').focus();
      });
      fetch('manifest.json', { cache: 'no-store' }).then((response) => { if (!response.ok) throw new Error('manifest'); return response.json(); }).then((data) => { images = Array.isArray(data) ? data : (Array.isArray(data.images) ? data.images : []); render(); }).catch(() => { $('gallery').innerHTML = '<div class="empty"><p><strong>ARCHIVE UNAVAILABLE</strong>CHECK MANIFEST.JSON</p></div>'; });
    })();
  </script>
</body>
</html>
