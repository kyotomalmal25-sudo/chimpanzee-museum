<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="CHIMPANZEE MUSEUM public image archive.">
  <title>CHIMPANZEE MUSEUM</title>
  <style>
    :root { --yellow: #f3f000; --black: #000; --ink: #f5f5f0; --muted: #8e8e88; --line: #242421; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { margin: 0; background: var(--black); color: var(--ink); font-family: Arial, Helvetica, sans-serif; letter-spacing: .02em; }
    button { font: inherit; cursor: pointer; }
    .shell { width: min(1120px, calc(100% - 64px)); margin: 0 auto; padding: 48px 0 36px; }
    header { margin-bottom: 38px; }
    h1 { margin: 0; font-size: clamp(2rem, 4vw, 3.7rem); line-height: .96; font-weight: 800; letter-spacing: -.055em; }
    h1 span { color: var(--yellow); }
    .gallery { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 34px 22px; }
    .card { min-width: 0; }
    .image-button { display: block; width: 100%; aspect-ratio: 1 / 1; padding: 0; border: 0; background: #111; overflow: hidden; }
    .image-button img { display: block; width: 100%; height: 100%; object-fit: cover; transition: transform .2s ease; }
    .image-button:hover img, .image-button:focus-visible img { transform: scale(1.025); }
    .image-button:focus-visible { outline: 2px solid var(--yellow); outline-offset: 3px; }
    .card-meta { padding-top: 10px; }
    .filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #d7d7d0; font-size: .69rem; letter-spacing: .04em; }
    .empty { grid-column: 1 / -1; min-height: 420px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: grid; place-items: center; text-align: center; color: var(--muted); }
    .empty p { margin: 0; font-size: .77rem; letter-spacing: .08em; }
    .empty strong { display: block; color: var(--yellow); font-size: .8rem; margin-bottom: 9px; letter-spacing: .12em; }
    .footer { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 42px; color: var(--muted); font-size: .68rem; letter-spacing: .09em; }
    .pagination { display: flex; align-items: center; gap: 18px; }
    .page-button { border: 0; background: transparent; color: var(--yellow); padding: 0; font-size: .72rem; font-weight: 700; letter-spacing: .1em; }
    .page-button:disabled { color: #3c3c36; cursor: default; }
    .page-number { color: #e9e9e2; min-width: 42px; text-align: center; }
    .lightbox[hidden] { display: none; }
    .lightbox { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 32px; background: rgba(0,0,0,.95); }
    .lightbox-inner { position: relative; max-width: min(1100px, 100%); max-height: 100%; }
    .lightbox img { display: block; max-width: 100%; max-height: calc(100vh - 64px); object-fit: contain; }
    .close-button { position: absolute; top: -30px; right: 0; border: 0; background: transparent; color: var(--yellow); padding: 0; font-size: .72rem; font-weight: 700; letter-spacing: .1em; }
    @media (max-width: 720px) { .shell { width: min(100% - 28px, 520px); padding-top: 26px; } header { margin-bottom: 26px; } .gallery { gap: 23px 10px; } .card-meta { padding-top: 7px; } .footer { margin-top: 30px; } .empty { min-height: 300px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: .001ms !important; animation-duration: .001ms !important; } }
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>CHIMPANZEE <span>MUSEUM</span></h1></header>
    <section class="gallery" id="gallery" aria-live="polite"></section>
    <footer class="footer">
      <div id="countLabel">0 IMAGES / PUBLIC ARCHIVE</div>
      <nav class="pagination" aria-label="Gallery pages">
        <button class="page-button" id="prevButton" type="button">← PREV</button>
        <span class="page-number" id="pageLabel">1 / 1</span>
        <button class="page-button" id="nextButton" type="button">NEXT →</button>
      </nav>
    </footer>
  </main>
  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Original image viewer">
    <div class="lightbox-inner"><button class="close-button" id="closeButton" type="button">CLOSE</button><img id="lightboxImage" alt=""></div>
  </div>
  <script>
    (() => {
      'use strict';
      const PAGE_SIZE = 9;
      let images = [], currentPage = 0;
      const $ = (id) => document.getElementById(id);
      const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#039;' }[char]));
      function render() {
        const pageCount = Math.max(1, Math.ceil(images.length / PAGE_SIZE));
        currentPage = Math.min(currentPage, pageCount - 1);
        const pageImages = images.slice(currentPage * PAGE_SIZE, (currentPage + 1) * PAGE_SIZE);
        $('gallery').innerHTML = pageImages.length ? pageImages.map((image) => `
          <article class="card" data-file="${escapeHtml(image.file)}">
            <button class="image-button" type="button" data-action="view" aria-label="View ${escapeHtml(image.alt || image.name || image.file)}">
              <img src="${escapeHtml(image.file)}" alt="${escapeHtml(image.alt || image.name || image.file)}" loading="lazy">
            </button>
            <div class="card-meta"><div class="filename" title="${escapeHtml(image.name || image.file)}">${escapeHtml(image.name || image.file)}</div></div>
          </article>`).join('') : '<div class="empty"><p><strong>NO EXHIBITS YET</strong>THE PUBLIC ARCHIVE IS BEING PREPARED</p></div>';
        $('countLabel').textContent = `${images.length} ${images.length === 1 ? 'IMAGE' : 'IMAGES'} / PUBLIC ARCHIVE`;
        $('pageLabel').textContent = `${currentPage + 1} / ${pageCount}`;
        $('prevButton').disabled = currentPage === 0;
        $('nextButton').disabled = currentPage >= pageCount - 1;
      }
      function closeLightbox() { $('lightbox').hidden = true; $('lightboxImage').removeAttribute('src'); }
      $('prevButton').addEventListener('click', () => { currentPage--; render(); });
      $('nextButton').addEventListener('click', () => { currentPage++; render(); });
      $('closeButton').addEventListener('click', closeLightbox);
      $('lightbox').addEventListener('click', (event) => { if (event.target === $('lightbox')) closeLightbox(); });
      document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !$('lightbox').hidden) closeLightbox(); });
      $('gallery').addEventListener('click', (event) => {
        const action = event.target.closest('[data-action]')?.dataset.action;
        const card = event.target.closest('.card');
        if (action !== 'view' || !card) return;
        const image = images.find((item) => item.file === card.dataset.file);
        if (!image) return;
        $('lightboxImage').src = image.file; $('lightboxImage').alt = image.alt || image.name || image.file; $('lightbox').hidden = false; $('closeButton').focus();
      });
      fetch('manifest.json', { cache: 'no-store' }).then((response) => { if (!response.ok) throw new Error('manifest'); return response.json(); }).then((data) => {
        images = Array.isArray(data) ? data : (Array.isArray(data.images) ? data.images : []);
        render();
      }).catch(() => { $('gallery').innerHTML = '<div class="empty"><p><strong>ARCHIVE UNAVAILABLE</strong>CHECK MANIFEST.JSON</p></div>'; });
    })();
  </script>
</body>
</html>
